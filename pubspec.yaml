name: lingobridge_ai
description: Aso Bhasha Shiki - free English and Japanese learning app built with Flutter and Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Versions are the caret ranges I chose; they were NOT resolved in this
# repository (no Flutter SDK available while writing). If `flutter pub get`
# reports a conflict, run `flutter pub upgrade --major-versions`.
dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3

  # Speech, audio, camera
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  record: ^6.0.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0

  # UI and storage
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/lessons.json
