name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (android/ios are not committed)
        run: flutter create . --org com.riachat --project-name lingobridge_ai

      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create . --org com.riachat --project-name lingobridge_ai
      - run: flutter pub get

      - name: Add Android permissions and minSdk 23
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n'
          )
          if "RECORD_AUDIO" not in s:
              s = s.replace("<application", perms + "    <application", 1)
          s = s.replace('android:label="lingobridge_ai"', 'android:label="Aso Bhasha Shiki"')
          open(p, "w").write(s)
          PY
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          done

      - name: Build APK
        run: flutter build apk --debug --dart-define=BACKEND=local

      - uses: actions/upload-artifact@v4
        with:
          name: aso-bhasha-shiki-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  functions:
    name: Cloud Functions build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
